<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Entrar | Painel da Raisa</title>
<meta name="description" content="Área restrita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#f7f3e8;--papel:#fff;--oliva:#5f6f45;--oliva-claro:#eaeee0;
  --tomate:#c74b34;--tomate-claro:#f7e6e1;--tinta:#2f2c22;--lapis:#6d6a5c;
  --borda:rgba(47,44,34,.14);--raio:2px;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  font-family:'Mulish',system-ui,sans-serif;font-size:14px;line-height:1.6;color:var(--tinta);
  background-color:var(--creme);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(95,111,69,.14) 31px 32px);
}
.cartao{
  width:min(380px,100%);background:var(--papel);border:1px solid var(--borda);
  border-left:6px solid var(--oliva);border-radius:var(--raio);padding:26px 24px;
  box-shadow:0 14px 34px -26px rgba(47,44,34,.9);
}
h1{font-size:18px;font-weight:800;margin:0 0 2px}
.sub{color:var(--lapis);font-size:12.5px;margin:0 0 20px}
label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--oliva);margin-bottom:5px}
input{
  width:100%;font:inherit;color:var(--tinta);background:var(--creme);
  border:1px solid var(--borda);border-bottom:2px solid var(--oliva);
  border-radius:var(--raio);padding:9px 10px;margin-bottom:14px;
}
input:focus-visible{outline:3px solid var(--tomate);outline-offset:2px}
button{
  width:100%;font:inherit;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  cursor:pointer;padding:11px;border:2px solid var(--oliva);background:var(--oliva);color:#fff;border-radius:var(--raio);
}
button:hover{background:#4c5a37;border-color:#4c5a37}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,a:focus-visible{outline:3px solid var(--tomate);outline-offset:2px}
.aviso{
  display:none;border-radius:var(--raio);padding:9px 11px;margin-bottom:14px;font-size:12.5px;
  background:var(--tomate-claro);border-left:3px solid var(--tomate);color:#8c3122;
}
.aviso.ok{background:var(--oliva-claro);border-left-color:var(--oliva);color:#42502f}
.aviso.aparece{display:block}
.link{
  display:inline-block;margin-top:14px;background:none;border:0;padding:0;width:auto;
  font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--lapis);
  text-decoration:underline;cursor:pointer;
}
.link:hover{color:var(--tomate);background:none}
.voltar{display:block;margin-top:18px;font-size:11.5px;color:var(--lapis);text-align:center}
</style>
</head>
<body>
<main class="cartao">
  <h1 id="titulo">Painel da Raisa</h1>
  <p class="sub" id="subtitulo">Área restrita. Entre para continuar.</p>

  <p class="aviso" id="aviso" role="alert"></p>

  <div id="blocoLogin">
    <form id="form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button type="submit" id="btn">Entrar</button>
    </form>
    <button type="button" class="link" id="esqueci">Esqueci minha senha</button>
  </div>

  <!-- Aparece quando você chega pelo link do e-mail de recuperação -->
  <div id="blocoNovaSenha" hidden>
    <form id="formNovaSenha">
      <label for="nova1">Nova senha</label>
      <input id="nova1" type="password" autocomplete="new-password" required>
      <label for="nova2">Repita a nova senha</label>
      <input id="nova2" type="password" autocomplete="new-password" required>
      <button type="submit" id="btnNova">Salvar nova senha</button>
    </form>
  </div>

  <a class="voltar" href="../">Voltar para o portfólio</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../js/banco.js?v=2"></script>
<script>
const aviso = document.getElementById('aviso');
const btn = document.getElementById('btn');

/* Endereço do painel montado de forma absoluta.
   Assim ele funciona com barra no fim, sem barra, ou com barra dobrada. */
const ENDERECO_ADMIN = new URL('../admin/', location.href).href;

function mostrar(texto, bom) {
  aviso.textContent = texto;
  aviso.className = 'aviso aparece' + (bom ? ' ok' : '');
}

/* Se o painel devolveu você para cá por não achar a sessão, ele avisa pela URL */
if (location.search.indexOf('semsessao=1') > -1) {
  mostrar('Você entrou, mas o painel não achou a sessão guardada. Tente entrar de novo. Se repetir, pode ser janela anônima ou o navegador bloqueando dados deste site.');
}

/* Rede de segurança: se por algum motivo a ida automática não acontecer,
   aparece um link para você entrar no painel com um clique. */
function linkDeSocorro() {
  if (document.getElementById('socorro')) return;
  const a = document.createElement('a');
  a.id = 'socorro';
  a.href = ENDERECO_ADMIN;
  a.className = 'voltar';
  a.style.fontWeight = '800';
  a.textContent = 'Abrir o painel agora';
  document.querySelector('.cartao').appendChild(a);
}

/* O link do e-mail de recuperação chega com "type=recovery" no endereço.
   Nesse caso a tela não manda para o painel: ela pede a senha nova. */
const pedaco = location.hash + ' ' + location.search;
const ehRecuperacao = pedaco.indexOf('type=recovery') > -1;

function telaDeNovaSenha() {
  document.getElementById('blocoLogin').hidden = true;
  document.getElementById('blocoNovaSenha').hidden = false;
  document.getElementById('titulo').textContent = 'Nova senha';
  document.getElementById('subtitulo').textContent = 'Escolha uma senha nova para entrar no painel.';
  document.getElementById('nova1').focus();
}

/* Se o link estiver vencido, o Supabase devolve o erro no próprio endereço */
if (pedaco.indexOf('error') > -1) {
  mostrar('Esse link de recuperação venceu ou já foi usado. Peça um novo em "Esqueci minha senha".');
}

/* Se já tiver sessão aberta, vai direto para o painel */
(async function () {
  if (!window.db) { mostrar('Não consegui falar com o banco agora. Recarregue a página.'); return; }
  if (ehRecuperacao) { telaDeNovaSenha(); return; }
  if (location.search.indexOf('semsessao=1') > -1) return;   // não fica indo e voltando
  const s = await window.acharSessao();
  if (s) location.replace(ENDERECO_ADMIN);
})();

/* O Supabase avisa quando a pessoa chegou por um link de recuperação */
if (window.db) {
  window.db.auth.onAuthStateChange(function (evento) {
    if (evento === 'PASSWORD_RECOVERY') telaDeNovaSenha();
  });
}

/* Salvar a senha nova */
document.getElementById('formNovaSenha').addEventListener('submit', async function (e) {
  e.preventDefault();
  const a = document.getElementById('nova1').value;
  const b = document.getElementById('nova2').value;
  if (a.length < 6) { mostrar('A senha precisa ter pelo menos 6 letras ou números.'); return; }
  if (a !== b) { mostrar('As duas senhas estão diferentes. Digite de novo.'); return; }

  const bn = document.getElementById('btnNova');
  bn.disabled = true; bn.textContent = 'Salvando...';
  const { error } = await window.db.auth.updateUser({ password: a });
  bn.disabled = false; bn.textContent = 'Salvar nova senha';

  if (error) {
    const m = (error.message || '').toLowerCase();
    if (m.indexOf('should be different') > -1) mostrar('Essa é a mesma senha de antes. Escolha uma diferente.');
    else if (m.indexOf('session') > -1 || m.indexOf('jwt') > -1) mostrar('Esse link de recuperação venceu. Peça um novo em "Esqueci minha senha".');
    else mostrar('Não consegui salvar a senha nova. Tente pedir um novo link.');
    return;
  }
  mostrar('Senha trocada. Entrando no painel...', true);
  setTimeout(function () { location.replace(ENDERECO_ADMIN); }, 1200);
});

/* Entrar */
document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  if (!window.db) { mostrar('Não consegui falar com o banco agora.'); return; }
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  if (!email || !senha) { mostrar('Preencha o e-mail e a senha.'); return; }

  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await window.db.auth.signInWithPassword({ email: email, password: senha });
  btn.disabled = false; btn.textContent = 'Entrar';

  if (!error) {
    /* Guardamos a cópia de segurança da sessão na mão. É isto que
       garante que o painel consegue abrir mesmo se a biblioteca
       perder a sessão ao trocar de página. */
    if (data && data.session) window.guardarCopiaDaSessao(data.session);

    /* Confere se dá para achar a sessão antes de sair desta tela */
    let guardou = false;
    for (let i = 0; i < 6 && !guardou; i++) {
      guardou = !!(await window.acharSessao());
      if (!guardou) await new Promise(r => setTimeout(r, 300));
    }
    if (!guardou) {
      mostrar('A sua senha está certa, mas este navegador não está guardando a sessão. Clique no link abaixo para abrir o painel.');
      linkDeSocorro();
      return;
    }
    mostrar('Tudo certo. Abrindo o painel...', true);
    setTimeout(linkDeSocorro, 2500);   // se a ida automática falhar, aparece o link
    location.replace(ENDERECO_ADMIN);
    return;
  }

  if (error) {
    /* Toda mensagem do Supabase vem em inglês. Aqui vira português. */
    const m = (error.message || '').toLowerCase();
    if (m.includes('email not confirmed')) mostrar('Esse e-mail ainda não foi confirmado. Procure o e-mail de confirmação do Supabase.');
    else if (m.includes('too many') || m.includes('rate limit')) mostrar('Muitas tentativas seguidas. Espere um minuto e tente de novo.');
    else mostrar('E-mail ou senha incorretos');
  }
});

/* Esqueci minha senha */
document.getElementById('esqueci').addEventListener('click', async function () {
  const email = document.getElementById('email').value.trim();
  if (!email) { mostrar('Escreva o seu e-mail no campo acima e clique de novo.'); return; }
  if (!window.db) { mostrar('Não consegui falar com o banco agora.'); return; }
  const volta = location.origin + location.pathname;   // volta para esta mesma tela
  const { error } = await window.db.auth.resetPasswordForEmail(email, { redirectTo: volta });
  if (error) mostrar('Não consegui enviar o e-mail de recuperação agora. Tente de novo em um minuto.');
  else mostrar('Enviei um e-mail de recuperação para ' + email + '. Olhe a caixa de entrada e o spam.', true);
});
</script>
</body>
</html>
